trigger:
  branches:
    include:
    - main

pr:
  branches:
    include:
    - main

pool:
  vmImage: 'ubuntu-24.04'

variables:
  isMainBranch: ${{ eq(variables['Build.SourceBranch'], 'refs/heads/main') }}

name: '4.4.$(Rev:r)'

stages:
- stage: installDeps
  displayName: Install Dependencies
  jobs:
  - job: 
    steps:
    # clone repo
    - checkout: self
      persistCredentials: true

    # install node/npm
    - task: NodeTool@1
      inputs:
        version: '22.x'

    # auth with amusement connect private registry
    - task: npmAuthenticate@0
      inputs:
        workingFile: $(Build.SourcesDirectory)/packages/amusementconnect/.npmrc

    - script: |
        cd packages/amusementconnect
        npm install --include=dev
        npm run build
      displayName: "npm install and build"

    - script: |
        npm publish
      displayName: "npm publish"

