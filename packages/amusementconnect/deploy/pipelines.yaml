trigger:
  branches:
    include:
    - main

pr:
  branches:
    include:
    - main

pool:
  vmImage: 'ubuntu-24.04'

variables:
  isMainBranch: ${{ eq(variables['Build.SourceBranch'], 'refs/heads/main') }}

name: '0.0.$(Rev:r)'

stages:
- stage: buildAndPublish
  displayName: Build and Publish
  jobs:
  - job: 
    steps:
    # clone repo
    - checkout: self
      persistCredentials: true

    # install node/npm
    - task: NodeTool@1
      inputs:
        version: '22.x'

    # Environment info
    - script: |
        echo "=== Environment Information ==="
        echo "Node version: $(node --version)"
        echo "NPM version: $(npm --version)"
        echo "Working directory: $(pwd)"
        echo "Current user: $(whoami)"
        echo "Build reason: $(Build.Reason)"
        echo "Source branch: $(Build.SourceBranch)"
        echo "Build number: $(Build.BuildNumber)"
        echo "================================"
      displayName: "Environment Info"

    # Directory structure
    - script: |
        echo "=== Directory Structure ==="
        ls -la
        echo "--- packages directory ---"
        ls -la packages/
        echo "--- amusementconnect directory ---"
        ls -la packages/amusementconnect/
        echo "=========================="
      displayName: "Directory Structure"

    # Install dependencies with extensive debugging
    - script: |
        echo "=== Installing Dependencies (Enhanced Debug) ==="
        cd packages/amusementconnect
        echo "Current directory: $(pwd)"
        
        # Show initial state
        echo "--- Before Installation ---"
        echo "Current .npmrc:"
        cat .npmrc || echo "No .npmrc found"
        echo ""
        echo "Node modules before install:"
        ls -la node_modules/ 2>/dev/null || echo "No node_modules directory"
        echo ""
        
        # Backup and remove .npmrc
        echo "Backing up .npmrc..."
        cp .npmrc .npmrc.backup || echo "No .npmrc to backup"
        rm -f .npmrc
        
        # Clean install environment
        echo "--- Cleaning Environment ---"
        npm cache clean --force
        rm -rf node_modules
        rm -rf package-lock.json
        
        # # Install with explicit registry
        # echo "--- Installing from Public Registry ---"
        # echo "Installing with explicit public registry..."
        # npm install --include=dev --registry=https://registry.npmjs.org/ --verbose
        
        # Verify installation
        echo "--- Post-Installation Verification ---"
        echo "Node modules after install:"
        ls -la node_modules/ | head -20
        echo ""
        echo "Checking @rollup directory:"
        ls -la node_modules/@rollup/ || echo "@rollup directory not found"
        echo ""
        echo "Checking plugin-alias specifically:"
        ls -la node_modules/@rollup/plugin-alias/ || echo "plugin-alias not found"
        echo ""
        echo "Checking if plugin-alias main file exists:"
        ls -la node_modules/@rollup/plugin-alias/dist/es/index.js || echo "Main file not found"
        echo ""
        echo "Package.json verification:"
        cat node_modules/@rollup/plugin-alias/package.json | head -10 || echo "Package.json not found"
        echo ""
        
        # Try to import the package with Node.js
        echo "Testing Node.js import:"
        node -e "
        try {
          const alias = require('@rollup/plugin-alias');
          console.log('✅ CommonJS import successful');
        } catch (e) {
          console.log('❌ CommonJS import failed:', e.message);
        }
        
        try {
          import('@rollup/plugin-alias').then(() => {
            console.log('✅ ES module import successful');
          }).catch(e => {
            console.log('❌ ES module import failed:', e.message);
          });
        } catch (e) {
          console.log('❌ ES module import failed:', e.message);
        }
        " || echo "Node test failed"
        
        echo "==============================="
      displayName: "Install Dependencies"

    # Build with detailed logging
    - script: |
        echo "=== Building Package ==="
        cd packages/amusementconnect
        echo "Current directory: $(pwd)"
        echo "Setting environment variables..."
        export NODE_ENV=production
        export INPUT_DIR=src/
        export OUTPUT_DIR=dist/
        echo "NODE_ENV=$NODE_ENV"
        echo "INPUT_DIR=$INPUT_DIR"
        echo "OUTPUT_DIR=$OUTPUT_DIR"
        echo "Starting build process..."
        npm run build:package --verbose
        echo "Build complete. Checking dist directory..."
        echo "Dist contents:"
        ls -la dist/ || echo "Dist directory not found"
        echo "========================"
      displayName: "Build Package"

    # auth with amusement connect private registry
    - task: npmAuthenticate@0
      inputs:
        workingFile: $(Build.SourcesDirectory)/packages/amusementconnect/.npmrc

    # Registry authentication with logging
    - script: |
        echo "=== Registry Authentication Info ==="
        echo "Checking .npmrc file..."
        cd packages/amusementconnect
        cat .npmrc || echo ".npmrc not found"
        echo "====================================="
      displayName: "Registry Info"

    # Publish with logging
    - script: |
        echo "=== Publishing Package ==="
        cd packages/amusementconnect
        echo "Current directory: $(pwd)"
        echo "Checking authentication..."
        npm whoami || echo "Not authenticated or authentication failed"
        echo "Package info:"
        cat package.json | grep -E '"name"|"version"'
        echo "Publishing with dry-run first..."
        npm publish --dry-run
        echo "Dry-run successful. Publishing for real..."
        npm publish
        echo "Publish complete!"
        echo "=========================="
      displayName: "Publish Package"

    # Final status
    - script: |
        echo "=== Build Summary ==="
        echo "Build completed successfully!"
        echo "Package: @ac/ac-primevue"
        echo "Version: $(cat packages/amusementconnect/package.json | grep '"version"' | cut -d'"' -f4)"
        echo "Build number: $(Build.BuildNumber)"
        echo "===================="
      displayName: "Build Summary"