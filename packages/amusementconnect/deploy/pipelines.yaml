trigger:
  branches:
    include:
    - main

pr:
  branches:
    include:
    - main

pool:
  vmImage: 'ubuntu-24.04'

variables:
  isMainBranch: ${{ eq(variables['Build.SourceBranch'], 'refs/heads/main') }}

name: '0.0.$(Rev:r)'

stages:
- stage: buildAndPublish
  displayName: Build and Publish
  jobs:
  - job: 
    steps:
    # clone repo
    - checkout: self
      persistCredentials: true

    # install node/npm
    - task: NodeTool@1
      inputs:
        version: '22.x'

    # Environment info
    - script: |
        echo "=== Environment Information ==="
        echo "Node version: $(node --version)"
        echo "NPM version: $(npm --version)"
        echo "Working directory: $(pwd)"
        echo "Current user: $(whoami)"
        echo "Build reason: $(Build.Reason)"
        echo "Source branch: $(Build.SourceBranch)"
        echo "Build number: $(Build.BuildNumber)"
        echo "================================"
      displayName: "Environment Info"

    # Directory structure
    - script: |
        echo "=== Directory Structure ==="
        ls -la
        echo "--- packages directory ---"
        ls -la packages/
        echo "--- amusementconnect directory ---"
        ls -la packages/amusementconnect/
        echo "=========================="
      displayName: "Directory Structure"

    # auth with amusement connect private registry
    - task: npmAuthenticate@0
      inputs:
        workingFile: $(Build.SourcesDirectory)/packages/amusementconnect/.npmrc

    # Install dependencies with complete registry override
    - script: |
        echo "=== Installing Dependencies (Complete Override) ==="
        cd packages/amusementconnect
        echo "Current directory: $(pwd)"
        
        # Show initial state
        echo "--- Environment Check ---"
        echo "Node version: $(node --version)"
        echo "NPM version: $(npm --version)"
        echo "NPM config list:"
        npm config list
        echo ""
        
        # Clear npm cache completely
        npm cache clean --force
        
        echo "Updated npm config:"
        npm config list
        echo ""
        
        # Clean environment
        echo "--- Cleaning Environment ---"
        rm -rf node_modules
        rm -rf package-lock.json
        
        # Install with maximum verbosity and error handling
        echo "--- Installing Dependencies ---"
        echo "Attempting npm install..."
        
        if npm install --include=dev --loglevel=verbose; then
            echo "✅ npm install succeeded"
        else
            echo "❌ npm install failed with exit code $?"
            echo "Trying alternative installation method..."
            
            # Try installing each critical package individually
            echo "Installing rollup packages individually..."
            npm install --registry=https://registry.npmjs.org/ rollup@^4.52.5 || echo "rollup install failed"
            npm install --registry=https://registry.npmjs.org/ @rollup/plugin-alias@^5.1.0 || echo "plugin-alias install failed"
            npm install --registry=https://registry.npmjs.org/ @rollup/plugin-babel@^6.0.3 || echo "plugin-babel install failed"
            npm install --registry=https://registry.npmjs.org/ @rollup/plugin-commonjs@^28.0.8 || echo "plugin-commonjs install failed"
            npm install --registry=https://registry.npmjs.org/ @rollup/plugin-node-resolve@^15.2.3 || echo "plugin-node-resolve install failed"
            npm install --registry=https://registry.npmjs.org/ @rollup/plugin-terser@^0.4.4 || echo "plugin-terser install failed"
            npm install --registry=https://registry.npmjs.org/ cross-env@^10.1.0 || echo "cross-env install failed"
            npm install --registry=https://registry.npmjs.org/ rollup-plugin-postcss@^4.0.0 || echo "rollup-plugin-postcss install failed"
            npm install --registry=https://registry.npmjs.org/ rollup-plugin-vue@^6.0.0-beta.9 || echo "rollup-plugin-vue install failed"
            npm install --registry=https://registry.npmjs.org/ dayjs@^1.11.18 || echo "dayjs install failed"
        fi
        
        # Verify installation
        echo "--- Post-Installation Verification ---"
        if [ -d "node_modules" ]; then
            echo "✅ node_modules directory created"
            echo "Node modules contents:"
            ls -la node_modules/ | head -20
            
            echo "Checking critical packages:"
            ls -la node_modules/@rollup/plugin-alias/ 2>/dev/null && echo "✅ @rollup/plugin-alias found" || echo "❌ @rollup/plugin-alias missing"
            ls -la node_modules/rollup/ 2>/dev/null && echo "✅ rollup found" || echo "❌ rollup missing"
        else
            echo "❌ node_modules directory was not created"
            echo "Current directory contents:"
            ls -la
        fi
        
        echo "==============================="
      displayName: "Install Dependencies"

    # Build with detailed logging
    - script: |
        echo "=== Building Package ==="
        cd packages/amusementconnect
        echo "Current directory: $(pwd)"
        echo "Setting environment variables..."
        export NODE_ENV=production
        export INPUT_DIR=src/
        export OUTPUT_DIR=dist/
        echo "NODE_ENV=$NODE_ENV"
        echo "INPUT_DIR=$INPUT_DIR"
        echo "OUTPUT_DIR=$OUTPUT_DIR"
        echo "Starting build process..."
        npm run build:package --verbose
        echo "Build complete. Checking dist directory..."
        echo "Dist contents:"
        ls -la dist/ || echo "Dist directory not found"
        echo "========================"
      displayName: "Build Package"

    # Registry authentication with logging
    - script: |
        echo "=== Registry Authentication Info ==="
        echo "Checking .npmrc file..."
        cd packages/amusementconnect
        cat .npmrc || echo ".npmrc not found"
        echo "====================================="
      displayName: "Registry Info"

    # Publish with logging
    - script: |
        echo "=== Publishing Package ==="
        cd packages/amusementconnect
        echo "Current directory: $(pwd)"
        echo "Checking authentication..."
        npm whoami || echo "Not authenticated or authentication failed"
        echo "Package info:"
        cat package.json | grep -E '"name"|"version"'
        echo "Publishing with dry-run first..."
        npm publish --dry-run
        echo "Dry-run successful. Publishing for real..."
        npm publish
        echo "Publish complete!"
        echo "=========================="
      displayName: "Publish Package"

    # Final status
    - script: |
        echo "=== Build Summary ==="
        echo "Build completed successfully!"
        echo "Package: @ac/ac-primevue"
        echo "Version: $(cat packages/amusementconnect/package.json | grep '"version"' | cut -d'"' -f4)"
        echo "Build number: $(Build.BuildNumber)"
        echo "===================="
      displayName: "Build Summary"